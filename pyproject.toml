[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-harness"
version = "0.1.0"
description = "A small, observable runtime for tool-using agents."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12,<3",
    "httpx>=0.28,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pyyaml>=6,<7",
    "apscheduler>=3.11,<4",
    "tzdata>=2026.1",
    "mcp>=2.3,<3",
    "jsonschema>=4.23,<5",
    "httpx2[socks]>=2.16,<3",
]

[project.scripts]
harness = "agent_harness.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]
desktop-build = ["pyinstaller>=6.16,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_harness"]
