# 路径相对本文件目录；工作树仅在明确选择 Git 隔离执行时创建。
worktrees_root = ".runtime/project-worktrees"
frontend_dist = "frontend/dist"

# 默认由页面打开真实项目，不自动登记工作区或演示验收器。

# 接入真实项目时取消以下注释，使用已有提交且已配置测试依赖的 Git 根目录。
# 明确选择隔离执行时，从 base_ref（默认 HEAD）建立独立 worktree，不包含源目录未提交改动。
# 网页打开本机目录默认直接修改所选目录，可在高级设置选择隔离。
# Windows 示例使用绝对 Python 解释器入口；Node 测试可登记 node.exe 与本地测试脚本。
# 不使用 npm.cmd 作为直接入口，不自动安装依赖，也不提交或合并回原分支。
# [[projects]]
# id = "backend"
# label = "我的后端项目"
# path = "../my-backend"
# test_argv = ['D:/projects/my-backend/.venv/Scripts/python.exe', '-m', 'pytest', '-q']
# test_timeout_seconds = 60.0
# 源码目录同时用于模型命令和宿主验收；省略自动根/已有src，[]仅根目录。
# python_paths = [".", "src"]

# python_executable = "D:/envs/my-project/Scripts/python.exe"
# 省略按 PATH；相对路径以实际工作区为准，隔离工作树不自动复制 .venv。
