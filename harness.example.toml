# 当前切片支持读、搜、写、局部编辑、命令五类工具；命令只用于可信本地任务，配置会保存为运行快照。
# 登记连接后可指定默认服务商和模型。省略时选首个启用服务商的默认模型。
# provider = "custom-local"
# requested_model = "your-model-id"

# 配置段可放在文件末尾；没有配置的探索、审阅角色继承父会话。
# [role_models.review]
# provider = "custom-local"
# requested_model = "your-other-model-id"

# 自定义服务商的配置段放在文件末尾。选择该服务商时用 --provider custom-local。
# [custom_providers.custom-local]
# name = "本机兼容服务"
# base_url = "http://127.0.0.1:11434/v1"
# default_model = "your-model-id"
# models = ["your-other-model-id"]
# auth = "none"
# enabled = true
tools = ["read_file", "search_files", "write_file", "edit_file", "run_command"]

# 宿主技能集合相对本配置文件解析。页面导入的副本存入运行数据目录。
skill_roots = ["examples/skills"]
# CLI 可在自定义配置中填写技能名。空列表表示不手选。
skills = []
# 交互主运行可按任务匹配已启用的技能，默认由用户手选。
skill_auto = false
# 外部工具默认不选择；CLI 可填写同一运行根已审核目录返回的 name/fingerprint 对，详见 docs/MCP.md。
mcp_tools = []

# 会话模式：默认允许工作区文件编辑；命令及验收逐项审批。仅研究使用 research，严格审批使用 strict。
permission_mode = "workspace_edit"

# 宿主权限上限，页面不能覆盖；目录为实际工作区内的相对前缀，空列表表示无对应范围。
[permission_policy]
read = "allow"
write = "allow"
command = "ask"
verification = "ask"
external = "ask" # MCP 默认逐次参数审批；deny 禁止连接和调用，allow 仍受研究/子权限与版本约束。
# 宿主明确允许后，自动化页面才能保存版本绑定的精确命令/验收/Hook持续授权；默认关闭。
automation_grants = false
read_roots = ["."]
write_roots = ["."]
approval_ttl_seconds = 1800 # 包含等待和排队的有效秒数，默认30分钟。

[limits]
max_model_turns = 20
max_tool_calls = 40
run_timeout_seconds = 300.0

# 根AGENTS.md固定快照；分层处理模型输入，完整原始轨迹仍保留。
[context]
load_project_instructions = true
# 单位均为字节；模型输入计量为 messages/tools 的紧凑 UTF-8 JSON，不等于 token。
max_input_bytes = 262144
max_project_instruction_bytes = 32768

# hybrid：输出外置、旧结果遮蔽，仍有压力再做结构化摘要；off关闭，masking不调用摘要模型。
compression = "hybrid"
trigger_ratio = 0.8
target_ratio = 0.6
inline_tool_bytes = 8192
keep_recent_groups = 3
max_summary_calls = 2
max_summary_bytes = 8192
# 可选声明供应商窗口，再扣除最大输出和安全余量；估算不等于精确tokenizer。
# model_context_tokens = 65536
token_safety_margin = 2048
